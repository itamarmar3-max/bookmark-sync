name: Supabase keep-alive

# Free Supabase projects are paused after ~7 days of inactivity. This workflow
# makes a tiny read-only request to the project every ~3 days so it stays
# active. It only reads (a single id, capped to 1 row) and changes nothing.
#
# The URL + publishable key below are public by design — the data is protected
# by Row Level Security, so this request returns no one's private data. If you
# ever rotate the publishable key or move projects, update the values here.
#
# Note: scheduled workflows run from the default branch only, and GitHub may
# auto-disable schedules after ~60 days with no repo activity (just re-enable
# from the Actions tab if that happens). You can also run it manually from the
# Actions tab ("Run workflow").

on:
  schedule:
    - cron: '0 6 */3 * *'   # every ~3 days at 06:00 UTC (well under the 7-day limit)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read-only)
        run: |
          SUPABASE_URL="https://qedjnioterasglhpnzdk.supabase.co"
          PUBLISHABLE_KEY="sb_publishable_tJfERoRop3vIOZBRFnFsUg_GYMd5UYy"

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/bookmarks?select=id&limit=1" \
            -H "apikey: ${PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${PUBLISHABLE_KEY}")

          echo "Supabase responded with HTTP ${STATUS}"

          # 2xx means the database was queried successfully (this is the "activity").
          # A 401/404 usually means the key or URL changed — fail so the run is
          # visibly red and you know to update this file.
          case "${STATUS}" in
            2*) echo "Keep-alive OK ✅"; exit 0 ;;
            *)  echo "Unexpected status — check the URL/key in this workflow"; exit 1 ;;
          esac
